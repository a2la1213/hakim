<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIOS — Cockpit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<main class="bento" style="grid-template-columns:1.1fr .9fr 1fr;">
  <section class="glass accent" id="card-mood">
    <div class="sec-label">◈ HUMEUR — ANAMNÈSE</div>
    <div id="mood-body">chargement…</div>
  </section>
  <section class="glass" id="card-feed">
    <div class="sec-label">◉ ACTIVITÉ LIVE <span class="dim" id="feed-count"></span></div>
    <div id="feed"></div>
  </section>
  <section class="glass rose" id="card-thoughts">
    <div class="sec-label rose">✧ PENSÉES INTERNES <span class="dim">· cliquer = texte intégral</span></div>
    <div id="thoughts"></div>
  </section>
  <section class="glass" id="card-dreams" style="grid-column:1/3;">
    <div class="sec-label">🌙 LABO DES RÊVES <span class="dim">· rêve réel vs jumeau fantôme</span>
      <a class="pill" href="/dreams" style="float:right;">OUVRIR LE LABO →</a></div>
    <div id="dreams-summary">chargement…</div>
  </section>
  <section class="glass" id="card-memory">
    <div class="sec-label">▤ MÉMOIRE <span class="dim" id="mem-count"></span>
      <a class="pill" href="/memory" style="float:right;">EXPLORER →</a></div>
    <div id="memories"></div>
  </section>
  <section class="glass" id="card-sessions" style="grid-column:1/2;">
    <div class="sec-label">▣ SESSIONS CLAUDE CODE <span class="dim" id="sess-count"></span></div>
    <div id="sessions"></div>
  </section>
  <section class="glass" id="card-inventory" style="grid-column:2/4;">
    <div class="sec-label">⚙ INVENTAIRE ACTIF <span class="dim" id="inv-sum"></span></div>
    <div id="inventory"></div>
  </section>
</main>
<script src="/nav.js"></script>
<script src="/detail.js"></script>
<script src="/app.js"></script>
</body>
</html>
